[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = [
  "python -m venv /app/.venv",
  "/app/.venv/bin/pip install -r requirements.txt"
]

[phases.build]
cmds = ["/app/.venv/bin/python manage.py collectstatic --noinput"]

[start]
cmd = "/app/.venv/bin/gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"